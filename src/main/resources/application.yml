  # 初始化 SQL 脚本
  sql:
    init:
      mode: always # always: 每次启动都尝试执行; never: 不自动执行 (防止重启清空线上数据库)
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true # 避免重复插入数据报错（可选，建议配合 INSERT IGNORE 使用，或者开发环境允许报错）

  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

