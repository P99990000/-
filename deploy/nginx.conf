
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    server_tokens   off; # 隐藏 Nginx 版本号

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name  localhost; # 修改为你的域名或公网IP

        # CVE-2011-3192 Mitigation (Apache Byte Range DoS)
        # 也可以在 Nginx 层面拦截恶意 Range 请求
        if ($http_range ~ "\d{2,},") {
            return 444;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # 前端静态资源
        location / {
            root   /opt/dorm-system/dist; # 修正为服务器上的实际部署路径
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # 支持 Vue Router History 模式
        }

        # 后端 API 代理
        location /api {
            proxy_pass http://localhost:8080; # 后端运行端口
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 文件上传目录代理 (如果后端保存文件在本地)
        location /uploads {
            proxy_pass http://localhost:8080;
        }
    }
}
